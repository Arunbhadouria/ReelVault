services:
  postgres:
    image: postgres:18-alpine
    container_name: reelvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reelvault
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: reelvault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U reelvault -d reelvault" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: reelvault-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
